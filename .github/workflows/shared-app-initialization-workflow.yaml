name: Shared Application Initialization Workflow

permissions:
  id-token: write
  contents: read
  pull-requests: read
on:
  workflow_call:
    secrets:
      AZURE_TENANT_ID:
        required: true
        description: "Azure Tenant ID"
      AZURE_CLIENT_ID:
        required: true
        description: "Azure Client ID"
      AZURE_SUBSCRIPTION_ID:
        required: true
        description: "Azure Subscription ID"
      AZURE_PLATFORM_SUBSCRIPTION_ID:
        required: true
        description: "Azure Platform Subscription ID (hosts uni-core-platform-kv, where the Dash0 secrets live)"
    inputs:
      environment:
        type: string
        required: true
        description: "Environment"
      SERVICE_PRINCIPAL_NAME:
        type: string
        required: true
        description: "Service Principal Name"
      RESOURCE_GROUP_NAME:
        type: string
        required: true
        description: "Resource Group Name"
      LOG_ANALYTICS_WORKSPACE_ID:
        type: string
        required: true
        description: "Log Analytics Workspace ID"

jobs:
  # Alert rules used to be deployed here via Initialize-PlatformTeamsNotificationApi.ps1 (AppInsights
  # scheduledQueryRules bicep). Alerting now lives in devops/dash0/check-rules/ as code, synced
  # per environment below via the Dash0 CLI, using Dash0 secrets pulled from uni-core-platform-kv.
  initialize_workload:
    name: Initialize Workload for ${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_PLATFORM_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: fetch dash0 secrets from key vault
        uses: azure/powershell@v3
        with:
          inlineScript: |
            $authTokenSecret = Get-AzKeyVaultSecret -VaultName uni-core-platform-kv -Name 'dash0-platform-authorization-secret-${{ inputs.environment }}'
            $otlpUrlSecret = Get-AzKeyVaultSecret -VaultName uni-core-platform-kv -Name 'dash0-endpoint'

            $authToken = ConvertFrom-SecureString $authTokenSecret.SecretValue -AsPlainText
            $otlpUrl = ConvertFrom-SecureString $otlpUrlSecret.SecretValue -AsPlainText

            Write-Output "::add-mask::$authToken"

            echo "DASH0_AUTH_TOKEN=$authToken" >> $env:GITHUB_ENV
            echo "DASH0_OTLP_URL=$otlpUrl" >> $env:GITHUB_ENV
          azPSVersion: "latest"
          errorActionPreference: "stop"
          failOnStandardError: true

      - name: setup dash0 cli
        uses: dash0hq/dash0-cli/.github/actions/setup@main
        with:
          # dash0-endpoint/dash0-metrics-endpoint in uni-core-platform-kv are OTLP ingest endpoints
          # (host:port, no scheme) for pushing telemetry; the CLI's own REST API lives at api-url,
          # which requires a scheme and is not one of the KV secrets.
          api-url: https://api.eu-west-1.aws.dash0.com
          otlp-url: ${{ env.DASH0_OTLP_URL }}
          auth-token: ${{ env.DASH0_AUTH_TOKEN }}

      - name: sync dash0 check rules
        run: dash0 apply -f devops/dash0/check-rules/exception-detected-alert.${{ inputs.environment }}.yaml
