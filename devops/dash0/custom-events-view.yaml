apiVersion: operator.dash0.com/v1alpha1
kind: Dash0View
metadata:
  name: platform-teams-notification-api-custom-events-__ENVIRONMENT__
  annotations:
    dash0.com/folder-path: "/Teams Notifications Api"
  labels:
    dash0.com/id: platform-teams-notification-api-custom-events-__ENVIRONMENT__
spec:
  type: spans
  display:
    name: Custom Events
    description: All custom events emitted by platform-teams-notification-api (TrackEvent spans), grouped by event name. Event properties (Team, Channel, MessageId, UniqueId, Duration, ...) are span tags.
  groupBy:
    - event.name
  filter:
    - key: service.name
      operator: is
      value: platform-teams-notification-api
    - key: event.name
      operator: is_set
  table:
    columns:
      - colSize: minmax(auto, 2fr)
        key: event.name
        label: Custom Event
      - colSize: min-content
        key: otel.span.start_time
        label: Start Time
      - colSize: minmax(auto, 1fr)
        key: Team
        label: Team
      - colSize: minmax(auto, 1fr)
        key: Channel
        label: Channel
      - colSize: minmax(auto, 1fr)
        key: TeamId
        label: Team Id
      - colSize: minmax(auto, 1fr)
        key: ChannelId
        label: Channel Id
      - colSize: minmax(auto, 1fr)
        key: MessageId
        label: Message Id
      - colSize: minmax(auto, 1fr)
        key: UniqueId
        label: Unique Id
      - colSize: minmax(auto, 1fr)
        key: FileName
        label: File Name
      - colSize: 8rem
        key: Duration
        label: Duration (ms)
      - colSize: minmax(auto, 1fr)
        key: ExceptionType
        label: Exception Type
      - colSize: minmax(auto, 2fr)
        key: ErrorMessage
        label: Error Message
      - colSize: 6rem
        key: StatusCode
        label: Status
      - colSize: minmax(auto, 1fr)
        key: otel.trace.id
        label: Trace Id
    sort:
      - direction: descending
        key: otel.span.start_time
