apiVersion: operator.dash0.com/v1alpha1
kind: Dash0View
metadata:
  name: platform-teams-notification-api-processing-errors-__ENVIRONMENT__
  annotations:
    dash0.com/folder-path: "/Teams Notifications Api"
  labels:
    dash0.com/id: platform-teams-notification-api-processing-errors-__ENVIRONMENT__
spec:
  type: spans
  display:
    name: Processing Errors
    description: Custom events signalling failures — Logic App file reprocessing, failed file uploads, failed card-resolved publishes and invalid operations caused by callers. Error, StatusCode, Team and Channel details are span tags.
  groupBy:
    - event.name
  filter:
    - key: service.name
      operator: is
      value: platform-teams-notification-api
    - key: event.name
      operator: is_one_of
      values:
        - LogAppProcessFile_NoChannelName
        - LogAppProcessFileUploadFailed
        - LogAppProcessFileError
        - TeamsCardResolvedPublishFailed
        - FileUploadFailed
        - InvalidOperationByUser
  table:
    columns:
      - colSize: minmax(auto, 2fr)
        key: event.name
        label: Custom Event
      - colSize: min-content
        key: otel.span.start_time
        label: Start Time
      - colSize: minmax(auto, 1fr)
        key: Team
        label: Team
      - colSize: minmax(auto, 1fr)
        key: Channel
        label: Channel
      - colSize: minmax(auto, 1fr)
        key: FileName
        label: File Name
      - colSize: minmax(auto, 1fr)
        key: file
        label: File
      - colSize: minmax(auto, 1fr)
        key: ExceptionType
        label: Exception Type
      - colSize: minmax(auto, 2fr)
        key: Error
        label: Error
      - colSize: minmax(auto, 2fr)
        key: ErrorMessage
        label: Error Message
      - colSize: minmax(auto, 2fr)
        key: Message
        label: Message
      - colSize: 6rem
        key: StatusCode
        label: Status
      - colSize: minmax(auto, 1fr)
        key: NotificationScheme
        label: Notification Scheme
      - colSize: minmax(auto, 1fr)
        key: otel.trace.id
        label: Trace Id
    sort:
      - direction: descending
        key: otel.span.start_time
