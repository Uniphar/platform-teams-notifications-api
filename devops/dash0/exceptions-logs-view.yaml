apiVersion: operator.dash0.com/v1alpha1
kind: Dash0View
metadata:
  name: platform-teams-notification-api-exception-logs-__ENVIRONMENT__
  annotations:
    dash0.com/folder-path: "/Teams Notifications Api"
  labels:
    dash0.com/id: platform-teams-notification-api-exception-logs-__ENVIRONMENT__
spec:
  type: logs
  display:
    name: Only unexpected exceptions
    description: Exception logs for platform-teams-notification-api.
  filter:
    - key: service.name
      operator: is
      value: platform-teams-notification-api
    - key: otel.log.severity.range
      operator: is_one_of
      values:
        - ERROR
        - FATAL
    - key: telemetry.non_alerting
      operator: is_not
      value: "true"

  table:
    columns:
      - colSize: min-content
        key: otel.log.time
        label: Time
      - colSize: min-content
        key: service.name
        label: Service
      - colSize: 7rem
        key: otel.log.severity.range
        label: Severity
      - colSize: minmax(auto, 4fr)
        key: otel.log.body
        label: Body
      - colSize: minmax(auto, 1fr)
        key: exception.type
        label: Exception Type
      - colSize: minmax(auto, 2fr)
        key: exception.message
        label: Exception Message
      - colSize: minmax(auto, 1fr)
        key: otel.trace.id
        label: Trace Id
    sort:
      - direction: descending
        key: otel.log.time
