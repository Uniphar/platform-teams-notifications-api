apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-teams-notification-api-exception-detected-__ENVIRONMENT__
  labels:
    dash0.com/id: platform-teams-notification-api-exception-detected-__ENVIRONMENT__
spec:
  groups:
    - name: Alerting
      interval: 5m
      rules:
        - alert: Teams Notifications Api Exception Detected (__ENVIRONMENT__)
          expr: sum(increase({otel_metric_name="dash0.spans", service_name="platform-teams-notification-api", otel_span_status_code="ERROR"}[5m])) > 0
          for: 0m
          annotations:
            summary: "Unhandled exception detected in platform-teams-notification-api (__ENVIRONMENT__)"
            description: "One or more spans with ERROR status were recorded for platform-teams-notification-api in __ENVIRONMENT__ over the last 5 minutes."
          labels:
            environment: __ENVIRONMENT__
            service: platform-teams-notification-api
